<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳩特數理 - 預約試聽</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 🌟 引入 SweetAlert2 (超美彈窗套件) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; background-color: #f4f5f7; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; background: white; }
        select:disabled { background: #f4f5f7; color: #999; }
        option.divider { color: #999; }
        input:focus, select:focus { border-color: #06C755; outline: none; box-shadow: 0 0 5px rgba(6,199,85,0.3); }
        button { width: 100%; padding: 14px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #loading { text-align: center; color: #06C755; margin-bottom: 15px; font-weight: bold; }
        .hint { display: block; margin-top: 5px; font-size: 13px; color: #666; }
        /* 🌟 下次上課時間的提示文字樣式 */
        /* 🌟 最近三次上課：直接點選，不需要選年份 */
        .session-list { display: flex; flex-direction: column; gap: 8px; }
        .session-option { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-weight: normal; color: #333; cursor: pointer; }
        .session-option input { width: auto; margin: 0; accent-color: #06C755; }
        .session-option.selected { border-color: #06C755; background: #effbf3; font-weight: bold; }
        .session-empty { padding: 12px; border: 1px dashed #ddd; border-radius: 8px; color: #999; font-size: 14px; }
        .section-title { border-bottom: 2px solid #06C755; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; color: #333; font-size: 16px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <h2>預約試聽</h2>
    <div id="loading">系統連線中... 請稍候</div>

    <form id="trialForm" style="display: none;">
        <div class="section-title">👤 基本資料</div>
        <div class="form-row">
            <div class="form-group" style="flex: 3;">
                <label for="name">學生姓名 <span style="color:red">*</span></label>
                <input type="text" id="name" required placeholder="請輸入真實姓名">
            </div>
            <div class="form-group" style="flex: 2;">
                <label for="grade">目前年級 <span style="color:red">*</span></label>
                <select id="grade" required>
                    <option value="">請選擇...</option>
                    <option value="小五">小五</option>
                    <option value="小六">小六</option>
                    <option value="國一">國一</option>
                    <option value="國二">國二</option>
                    <option value="國三">國三</option>
                    <option value="高一">高一</option>
                    <option value="高二">高二</option>
                    <option value="高三">高三</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="course">想試聽的課程 <span style="color:red">*</span></label>
            <select id="course" required disabled>
                <option value="">⏳ 課程載入中...</option>
            </select>
            <span id="courseHint" class="hint"></span>
        </div>

        <div class="form-group">
            <label>希望試聽日期 <span style="color:red">*</span></label>
            <!-- 列出最近三次上課，點一個就好 -->
            <div id="sessionList" class="session-list" role="radiogroup">
                <div class="session-empty">請先選擇課程</div>
            </div>
            <span id="sessionHint" class="hint"></span>
        </div>

        <div class="section-title">📞 聯絡方式 (請至少填寫一項)</div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone_student">學生手機</label>
                <input type="tel" id="phone_student" class="phone-input" placeholder="09...">
            </div>
            <div class="form-group">
                <label for="phone_home">家裡電話</label>
                <input type="tel" id="phone_home" class="phone-input" placeholder="03...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone_dad">父親手機</label>
                <input type="tel" id="phone_dad" class="phone-input" placeholder="09...">
            </div>
            <div class="form-group">
                <label for="phone_mom">母親手機</label>
                <input type="tel" id="phone_mom" class="phone-input" placeholder="09...">
            </div>
        </div>

        <div class="form-group">
            <label for="phone_other">其他聯絡方式 (備註)</label>
            <input type="text" id="phone_other" placeholder="阿公/阿嬤 或 LINE ID等...">
        </div>

        <button type="submit" id="submitBtn" style="margin-top: 10px;">確認送出</button>
    </form>
</div>

<script>
    // 🔴 替換區：你的 Firebase 金鑰
    const firebaseConfig = {
        apiKey: "AIzaSyADP9HfxjVQOAD0zxGtWvMk_nRposqyqSY",
        authDomain: "shiftar-jutor.firebaseapp.com",
        projectId: "shiftar-jutor"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔴 替換區：你的 LIFF ID
    const myLiffId = "2010319288-H6zr1ioX";

    let lineProfile = null;
    let allCourses = [];      // [{label, course, sessions, grade, is_promotion}]
    let courseByValue = {};   // 實際班級名稱 → 課程資料
    const MAX_SHOWN_SESSIONS = 3;  // 家長看到最近三次上課

    const GRADE_PATTERN = "(小[一二三四五六]|國[一二三]|高[一二三])";
    const GRADE_ORDER = { 小一: 10, 小二: 20, 小三: 30, 小四: 40, 小五: 50, 小六: 60, 國一: 70, 國二: 80, 國三: 90, 高一: 100, 高二: 110, 高三: 120 };
    const NEXT_GRADE = { 小五: "小六", 小六: "國一", 國一: "國二", 國二: "國三", 國三: "高一", 高一: "高二", 高二: "高三" };
    const SUBJECT_ORDER = ["數學", "國文", "英文", "自然", "理化", "物理", "化學", "生物", "地科"];

    // 家長看到的課名（與 ERP public_course_label 相同）：去掉季別與堂數，例如「高二數學_26Q4 (12堂)」→「高二數學」
    function stripTermSuffix(name) {
        return String(name || "")
            .replace(/_[^\s()\[\]]+/g, "")
            .replace(/\s*[(（]\s*\d+\s*堂[^)）]*[)）]/g, "")
            .replace(/\s{2,}/g, " ")
            .trim();
    }

    function gradeInfo(label) {
        const promotion = label.match(new RegExp("升\\s*" + GRADE_PATTERN));
        if (promotion) return { grade: promotion[1], is_promotion: true };
        const match = label.match(new RegExp(GRADE_PATTERN));
        return { grade: match ? match[1] : "", is_promotion: false };
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    // 台灣時間 (UTC+8)，避免凌晨報名被記成前一天
    function taipeiIso(date) {
        return new Date(date.getTime() + 8 * 3600 * 1000).toISOString().replace("Z", "+08:00");
    }

    // 「2026-11-26T10:00」+「12:00」→「11/26（週四）10:00~12:00」（不顯示年份）
    function sessionLabel(start, end) {
        const [y, m, d] = start.slice(0, 10).split("-").map(Number);
        const weekday = "日一二三四五六"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
        return `${m}/${d}（週${weekday}）${start.slice(11, 16)}${end ? "~" + end.slice(11, 16) : ""}`;
    }

    // 舊格式只有「11/24 (週二) 19:00~21:30」：補上年份轉成一個場次（跨年時算明年）
    function sessionFromNextTime(text, course, nowLocal) {
        const m = String(text || "").match(/(\d{1,2})\/(\d{1,2}).*?(\d{1,2}):(\d{2})\s*[~～-]\s*(\d{1,2}):(\d{2})/);
        if (!m) return null;
        const p2 = n => String(n).padStart(2, "0");
        let year = Number(nowLocal.slice(0, 4));
        const date = `${p2(m[1])}-${p2(m[2])}`;
        if (`${year}-${date}` < nowLocal.slice(0, 10) && Number(m[1]) < Number(nowLocal.slice(5, 7))) year += 1;
        const day = `${year}-${date}`;
        return { course, start: `${day}T${p2(m[3])}:${m[4]}`, end: `${day}T${p2(m[5])}:${m[6]}` };
    }

    // 「2026-11-23T19:00」→「11月23日（週一）19:00」；只有日期時不帶時間
    function arrivalText(dateText, timeText) {
        const [y, m, d] = String(dateText).slice(0, 10).split("-").map(Number);
        if (!y || !m || !d) return "";
        const weekday = "日一二三四五六"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
        return `${m}月${d}日（週${weekday}）${timeText ? " " + timeText : ""}`;
    }

    function courseSortKey(c) {
        const subjectIndex = SUBJECT_ORDER.findIndex(s => c.label.includes(s));
        return [GRADE_ORDER[c.grade] || 999, subjectIndex === -1 ? 99 : subjectIndex, c.label];
    }

    function compareCourses(a, b) {
        const ka = courseSortKey(a), kb = courseSortKey(b);
        for (let i = 0; i < ka.length; i++) {
            if (ka[i] < kb[i]) return -1;
            if (ka[i] > kb[i]) return 1;
        }
        return 0;
    }

    // 年級推薦：同年級的常態課；小六等升學階段則推薦「升國一」這類銜接課
    function isRecommended(course, studentGrade) {
        if (!studentGrade || !course.grade) return false;
        if (course.is_promotion) return course.grade === NEXT_GRADE[studentGrade];
        return course.grade === studentGrade;
    }

    // 🌟 功能 1：去資料庫撈取 ERP 同步的課程表
    async function loadCourses() {
        const courseSelect = document.getElementById("course");
        try {
            const docRef = await db.collection("settings").doc("public_courses").get();
            const data = docRef.exists ? docRef.data() : {};
            let rows = [];
            const nowLocal = taipeiIso(new Date()).slice(0, 16);  // 「YYYY-MM-DDTHH:MM」台灣時間
            const list = Array.isArray(data.course_list) ? data.course_list : [];
            const isFuture = x => x && x.start && String(x.start).slice(0, 16) > nowLocal;
            if (list.length) {
                // 新格式：顯示名稱 + 實際班級名稱 + 未來上課場次
                rows = list.map(item => {
                    const label = stripTermSuffix(item.label || item.course);
                    const info = item.grade !== undefined ? { grade: item.grade || "", is_promotion: !!item.is_promotion } : gradeInfo(label);
                    const course = String(item.course || label);
                    let sessions = Array.isArray(item.sessions)
                        ? item.sessions.map(x => ({ course: String(x.course || course), start: String(x.start || "").slice(0, 16), end: String(x.end || "").slice(0, 16) }))
                        : [sessionFromNextTime(item.next_time, course, nowLocal)];
                    // 同步後已經過去的場次在這裡濾掉，不用等下一次同步
                    sessions = sessions.filter(isFuture);
                    return { label, course, sessions, ...info };
                });
            } else {
                // 舊格式相容：{ 課程名稱: 下次時間 }
                rows = Object.entries(data.courses || {}).map(([name, nextTime]) => {
                    const label = stripTermSuffix(name);
                    return { label, course: name, sessions: [sessionFromNextTime(nextTime, name, nowLocal)].filter(isFuture), ...gradeInfo(label) };
                });
            }
            rows = rows.filter(c => c.sessions.length);  // 沒有未來上課日的課程不顯示

            const seenLabels = new Set();
            allCourses = rows.filter(c => {
                if (!c.label || seenLabels.has(c.label)) return false;
                seenLabels.add(c.label);
                return true;
            }).sort(compareCourses);
            courseByValue = {};
            allCourses.forEach(c => { courseByValue[c.course] = c; });

            renderCourseOptions();
        } catch (error) {
            console.error("無法載入課程:", error);
            courseSelect.innerHTML = '<option value="">載入失敗，請重新開啟</option>';
        }
    }

    // 🌟 功能 2：依年級把推薦課程排在最前面
    function renderCourseOptions() {
        const courseSelect = document.getElementById("course");
        const courseHint = document.getElementById("courseHint");
        const studentGrade = document.getElementById("grade").value;
        const previous = courseSelect.value;

        courseSelect.innerHTML = "";
        if (!allCourses.length) {
            courseSelect.innerHTML = '<option value="">(目前無開放課程)</option>';
            courseSelect.disabled = true;
            courseHint.textContent = "";
            updateNextTimeHint();
            return;
        }
        if (!studentGrade) {
            courseSelect.innerHTML = '<option value="">請先選擇年級</option>';
            courseSelect.disabled = true;
            courseHint.textContent = "";
            updateNextTimeHint();
            return;
        }

        const recommended = allCourses.filter(c => isRecommended(c, studentGrade));
        const others = allCourses.filter(c => !isRecommended(c, studentGrade));

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "請選擇...";
        courseSelect.appendChild(placeholder);

        const appendCourses = items => items.forEach(c => {
            const option = document.createElement("option");
            option.value = c.course;
            option.textContent = c.label;
            courseSelect.appendChild(option);
        });
        // 同年級課程放最上方 → 分隔線 → 其他年級依年級順序排列
        appendCourses(recommended);
        if (recommended.length && others.length) {
            const divider = document.createElement("option");
            divider.disabled = true;
            divider.value = "";
            divider.className = "divider";
            divider.textContent = "──── 以下為其他年級課程 ────";
            courseSelect.appendChild(divider);
        }
        appendCourses(others);

        courseHint.textContent = recommended.length
            ? `已將適合${studentGrade}的課程排在最前面`
            : `目前沒有${studentGrade}專屬課程，可從所有課程中選擇`;

        // 年級改了：保留仍存在的選擇，否則只有一門推薦課時自動帶入
        if (previous && courseByValue[previous]) {
            courseSelect.value = previous;
        } else if (recommended.length === 1) {
            courseSelect.value = recommended[0].course;
        }
        courseSelect.disabled = false;
        updateNextTimeHint();
    }

    // 🌟 功能 3：選好課程後，列出最近三次上課讓家長直接點選
    function updateNextTimeHint() {
        const selected = courseByValue[document.getElementById("course").value];
        const list = document.getElementById("sessionList");
        const sessionHint = document.getElementById("sessionHint");
        list.innerHTML = "";
        if (!selected) {
            list.innerHTML = '<div class="session-empty">請先選擇課程</div>';
            sessionHint.textContent = "";
            return;
        }
        const shown = selected.sessions.slice(0, MAX_SHOWN_SESSIONS);
        shown.forEach((x, index) => {
            const option = document.createElement("label");
            option.className = "session-option" + (index === 0 ? " selected" : "");
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "trial_session";
            radio.value = String(index);
            radio.checked = index === 0;  // 預設最近一次上課
            radio.addEventListener("change", () => {
                list.querySelectorAll(".session-option").forEach(el => el.classList.remove("selected"));
                option.classList.add("selected");
            });
            option.appendChild(radio);
            option.appendChild(document.createTextNode(sessionLabel(x.start, x.end)));
            list.appendChild(option);
        });
        sessionHint.textContent = shown.length > 1
            ? `以下是最近 ${shown.length} 次上課，請點選想試聽的日期`
            : "目前只有這一次上課可以預約試聽";
    }

    document.getElementById("grade").addEventListener("change", renderCourseOptions);
    document.getElementById("course").addEventListener("change", updateNextTimeHint);

    // 初始化 LIFF
    liff.init({ liffId: myLiffId }).then(() => {
        if (!liff.isLoggedIn()) { liff.login(); }
        else {
            liff.getProfile().then(profile => {
                lineProfile = profile;
                loadCourses();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('trialForm').style.display = 'block';
            });
        }
    }).catch(error => {
        console.error("LIFF 初始化失敗:", error);
        document.getElementById('loading').textContent = "連線失敗，請從 LINE 重新開啟此頁面";
    });

    // 🌟 表單送出檢查與防呆
    document.getElementById("trialForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        // 【防呆 1】防手抖冷卻機制 (防止 1 分鐘內重複送出)
        const lastSubmit = localStorage.getItem("lastTrialSubmit");
        if (lastSubmit && (Date.now() - parseInt(lastSubmit)) < 60000) {
            Swal.fire({ icon: 'warning', title: '請勿重複送出', text: '您剛剛已經預約過了，請稍後再試。', confirmButtonColor: '#06C755' });
            return;
        }

        // 【防呆 2】電話五選一必填
        const pStu = document.getElementById("phone_student").value.trim();
        const pHome = document.getElementById("phone_home").value.trim();
        const pDad = document.getElementById("phone_dad").value.trim();
        const pMom = document.getElementById("phone_mom").value.trim();
        const pOther = document.getElementById("phone_other").value.trim();

        if (!pStu && !pHome && !pDad && !pMom && !pOther) {
            Swal.fire({ icon: 'error', title: '資料不完整', text: '請至少留下一個可以聯絡到您的電話或方式！', confirmButtonColor: '#06C755' });
            return;
        }

        const selectedCourse = courseByValue[document.getElementById("course").value];
        if (!selectedCourse) {
            Swal.fire({ icon: 'error', title: '資料不完整', text: '請選擇想試聽的課程。', confirmButtonColor: '#06C755' });
            return;
        }
        const checked = document.querySelector('input[name="trial_session"]:checked');
        const session = checked ? selectedCourse.sessions[Number(checked.value)] : null;
        if (!session) {
            Swal.fire({ icon: 'error', title: '資料不完整', text: '請選擇試聽日期。', confirmButtonColor: '#06C755' });
            return;
        }
        const trial = { course: session.course, trial_date: session.start.slice(0, 10), trial_time: session.start.slice(11, 16), trial_start: session.start, trial_end: session.end };

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "資料傳送中...";

        // 整理對齊 ERP 的 Payload
        const nowIso = taipeiIso(new Date());
        const mainPhone = pStu || pDad || pMom || pHome; // 找一個當作主要代表號
        const payload = {
            name: document.getElementById("name").value.trim(),
            grade: document.getElementById("grade").value,
            course: trial.course,                   // 實際班級名稱（含季別），ERP 入班用
            course_label: selectedCourse.label,     // 家長看到的名稱
            trial_date: trial.trial_date,
            trial_time: trial.trial_time,
            trial_start: trial.trial_start,
            trial_end: trial.trial_end,
            trial_date_status: "scheduled",
            registration_date: nowIso.slice(0, 10),
            student_phone: pStu,
            home_phone: pHome,
            father: pDad,
            mother: pMom,
            phone: mainPhone,
            note: pOther ? `其他聯絡:${pOther}` : "",
            status: "pending",
            source: "liff",
            created_at: nowIso,
            line_user_id: lineProfile ? lineProfile.userId : "未知",
            line_display_name: lineProfile ? lineProfile.displayName : "未知"
        };

        try {
            await db.collection("trial_students").add(payload);

            localStorage.setItem("lastTrialSubmit", Date.now().toString()); // 紀錄送出時間防連點

            // 🌟 超美客製化成功訊息
            Swal.fire({
                icon: 'success',
                title: '預約成功！',
                html: `麻煩在 <b>${escapeHtml(arrivalText(trial.trial_date, trial.trial_time))}</b><br>到班參加試聽<br><span style="font-size:14px;color:#666">課程：${escapeHtml(selectedCourse.label)}</span>`,
                confirmButtonText: '關閉視窗',
                confirmButtonColor: '#06C755',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    liff.closeWindow(); // 家長點擊關閉後，自動把 LINE 視窗收掉
                }
            });

        } catch (error) {
            console.error("寫入 Firebase 失敗: ", error);
            Swal.fire({ icon: 'error', title: '系統異常', text: '預約失敗，請稍後再試或直接聯絡客服。', confirmButtonColor: '#06C755' });
            submitBtn.disabled = false;
            submitBtn.innerText = "確認送出";
        }
    });
</script>
</body>
</html>
